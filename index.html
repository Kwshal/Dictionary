<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Shhhh</title>
     <link rel="stylesheet" href="./style.css">
     <link rel="manifest" href="./manifest.json">
     <meta name="theme-color" content="#ffffff">

</head>

<body>
     <!-- full screen textakgfrea (input) -->

     <h5 id="title">Dictionary</h5>
     <input type="text" id="input-area" placeholder="Type here..."></input>
     <main>
          <form id="input-form">
                    <select name="word-type" id="word-type">
                         <option value="names-list">Name</option>
                         <option value="words-list">Word</option>
                         <option value="places-list">Spot</option>
                         <option value="verbs-list">Verb</option>
                         <option value="sentences-list">Line</option>
                         <option value="dates-list">Date</option>
                    </select>
               <input type="text" id="word-input" placeholder="Add New Word"></input>
               <!-- <div class="select-wrapper"> -->
                    <button type="button" id="add-btn">Add</button>
               <!-- </div> -->

          </form>

          <!-- filters tabs -->
          <div id="filter-btns-container">
               <button data-list-name="names-list" class="hide-btn">@</button>
               <button data-list-name="places-list" class="hide-btn">#</button>
               <button data-list-name="verbs-list" class="hide-btn">/</button>
               <button data-list-name="words-list" class="hide-btn">W</button>|
               <button data-list-name="sentences-list" class="hide-btn">L</button>
               <button data-list-name="dates-list" class="hide-btn">⏱︎</button>|
               <a id="chat-link" href="./chat.html">CHAT</a>
          </div>
          
          <section>
               <div class="head-wrapper">
                    <h5 id="names-heading">Names </h5>
                    <hr>
               </div>
               <input type="checkbox" id="name">
               <ol id="names-list">
               </ol>
          </section>
          <section>
               <div class="head-wrapper">
                    <h5 id="places-heading">Spots </h5>
                    <hr>
               </div>
               <input type="checkbox" id="place">
               <ol id="places-list">
               </ol>
          </section>
          <section>
               <div class="head-wrapper">
                    <h5 id="verbs-heading">Verbs </h5>
                    <hr>
               </div>
               <input type="checkbox" id="verb">
               <ol id="verbs-list">
               </ol>
          </section>
          <section>
               <div class="head-wrapper">
                    <h5 id="words-heading">Words </h5>
                    <hr>
               </div>
               <input type="checkbox" id="word">
               <ol id="words-list">
               </ol>
          </section>
          <br>
          <section>
               <div class="head-wrapper">
                    <h5 id="sentences-heading">Lines </h5>
                    <hr>
               </div>
               <input type="checkbox" id="sentence">
               <ol id="sentences-list">
               </ol>
          </section>
          <section>
               <div class="head-wrapper">
                    <h5 id="dates-heading">Dates </h5>
                    <hr>
               </div>
               <input type="checkbox" id="date">
               <ol id="dates-list"></ol>
               </ol>
          </section>
     </main>
     <script src="script.js" type="module"></script>
     <script src="db.js" type="module"></script>
</body>

</html>
