<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Shhhh</title>
     <link rel="stylesheet" href="./style.css">
     <link rel="manifest" href="./manifest.json">
     <meta name="theme-color" content="#ffffff">

</head>

<body>
     <!-- full screen textarea (input) -->

     <input type="text" id="input-area" placeholder="Type here..."></input>
     <!-- <h5>Dictionary</h5> -->
     <main>
          <form id="input-form">
               <input type="text" id="word-input" placeholder="Word = Meaning"></input>

                    <select name="word-type" id="word-type">
                         <option value="words-list">word</option>
                         <option value="names-list">@ name</option>
                         <option value="places-list"># place</option>
                         <option value="verbs-list">. verb</option>
                         <option value="sentences-list">sentence</option>
                    </select>
                    <button type="button" id="add-btn">Add</button>
               </div>

          </form>
          <!-- <hr> -->
          <section>
               <div class="head-wrapper">
                    <!-- <hr> -->
                    <h5 id="names-heading">Names </h5>
                    <!-- <button id="add-name" class="add">
                         +
                    </button>
                    <label for="name"><img alt="eye" src="./eye.png"></label> -->
                    <hr>
               </div>
               <input type="checkbox" id="name">
               <ol id="names-list">
               </ol>
          </section>
          <!-- <hr> -->

          <section>
               <div class="head-wrapper">
                    <!-- <hr> -->
                    <h5 id="places-heading">Places </h5>
                    <!-- <button id="add-place" class="add">

          </section>
          <!-- <hr> -->


          <section>
               <div class="head-wrapper">
                    <!-- <hr> -->

                    <!-- <button id="add-verb" class="add">
                         +

                    <label for="verb"><img alt="eye" src="./eye.png"></label> -->
                    <hr>
               </div>
               <input type="checkbox" id="verb">

               </ol>
          </section>
          <!-- <hr> -->
          <section>
               <div class="head-wrapper">
                    <!-- <hr> -->
                    <h5 id="words-heading">Words </h5>
                    <!-- <button id="add-word" class="add">
                         +
                    </button>
                    <label for="word"><img alt="eye" src="./eye.png"></label> -->
                    <hr>
               </div>
               <input type="checkbox" id="word">

          </section>
          <!-- <hr> -->

                    <!-- <button id="add-sentence" class="add">

               </ol>
          </section>



     </main>
     <script src="script.js" type="module"></script>
     <script src="db.js" type="module"></script>

</html>
