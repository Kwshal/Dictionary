<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Chat</title>
     <style>
          * {
               font-family: sans-serif;
               margin: 0;
               padding: 0;
               box-sizing: border-box;
          }

          body {
               background-color: beige;
               display: flex;
               flex-direction: column;
               align-items: center;
               gap: 10px;
               width: 100%;
          }

          #chat-window {
               width: clamp(300px, 90%, 600px);
               height: fit-content;
               display: flex;
               flex-direction: column;
               /* gap: 10px; */
               padding: 10px;
               /* border: #555 solid 1px; */
          }

          header {
               display: flex;
               justify-content: space-between;
               align-items: center;
               padding: 10px;
               position: relative;
               border-radius: 30px;
               box-shadow: #aaa 0px 3px 5px;
               background-color: white;
          }

          a {
               text-decoration: none;
               color: #fffdfd;
               z-index: 1;
               /* padding: 5px 10px; */
               display: flex;
               justify-content: center;
               align-items: center;
               height: 30px;
               width: 30px;
               border-radius: 30px;
               /* font-family: 'Courier New', Courier, monospace; */
               background-color: #555;
               rotate: -90deg;
          }

          h1 {
               /* font-size: xx-large; */
               font-family: monospace;
               position: absolute;
               text-align: center;
               width: 100%;
               color: #555;
          }

          ul {
               width: 100%;
               list-style: none;
               display: flex;
               flex-direction: column;
               /* border: #555 solid 1px; */
               padding: 5px;
               gap: 5px;

               li {
                    padding: 10px;
                    /* break anywhere */
                    word-wrap: anywhere;
                    border-radius: 20px;
               }
          }

          .response {
               align-self: flex-start;
               box-shadow: #aaa 0px 3px 5px;
               background-color: white;
               color: #555;
          }

          .prompt {
               max-width: 80%;
               align-self: flex-end;
               box-shadow: #aaa 0px 3px 5px;
               background-color: white;
               color: #555;
          }

          .input-container {
               width: 100%;
               display: flex;
               justify-content: right;
               align-items: center;
               /* padding: 10px; */
               gap: 5px;
               position: relative;
               border-radius: 30px;
               /* background-color: white; */
          }

          #input-area {
               width: 100%;
               border: none;
               padding: 15px;
               border-radius: 30px;
               outline: none;
               box-shadow: #aaa 0px 3px 5px;
          }

          #send-button {
               height: 80%;
               /* min-width: 45px; */
               aspect-ratio: 1;
               border: none;
               outline: none;
               border-radius: 30px;
               background-color: #555;
               color: #ffffff;
               /* box-shadow: #aaa 0px 3px 5px; */
               /* font-size: large; */
               position: absolute;
               font-size: large;
               right: 7px;
               z-index: 15;
               cursor: pointer;
          }
     </style>
</head>

<body>
     <div id="chat-window">
          <header>
               <a href="./index.html">△</a>
               <h1>1.9//</h1>
          </header>
          <main>
               <ul id="messages">
                    <!-- <li class="prompt">this is prompt. Lorem ipsum Lorem ipsum dolor sit, amet consectetur adipisicing elit. Sed expedita illum cupiditate dignissimos laborum amet, facere temporibus aliquid est? Dicta fugit incidunt officiis laboriosam modi reprehenderit saepe, cumque aut placeat..</li> -->
                    <!-- <li class="response">this is response</li> -->
               </ul>
               <div class="input-container">
                    <input type="text" id="input-area" placeholder="Message">
                    <button id="send-button">△</button>
               </div>
          </main>
     </div>
     <script src="ai.js" type="module"></script>
</body>

</html>
